name: TMatrix checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # go.mod declares the minimum; build with a maintained, patched toolchain.
          go-version: 'stable'
          check-latest: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/test_install.py
      - run: ./scripts/test_install.ps1
        shell: pwsh
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_release_local.py
      - run: python3 scripts/test_release_workflow.py
      - run: npm audit
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
