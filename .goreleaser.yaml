version: 2
project_name: tmatrix
before:
  hooks:
    - go mod verify
    - python3 scripts/stage-release.py
builds:
  - id: tmatrix
    main: ./cmd/tmatrix
    binary: tmatrix
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.commitCount={{.Env.TMATRIX_COMMIT_COUNT}}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: staging/release-engine
        dst: engine
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  draft: true
  name_template: "TMatrix {{.Version}} (build {{.Env.TMATRIX_COMMIT_COUNT}}, {{.ShortCommit}})"
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
    - glob: scripts/uninstall-daemon.sh
    - glob: scripts/uninstall-daemon.ps1
